<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Residence Template</title>
</head>
<body>
  <!-- Simple template used by generator. -->
  <h1>Residence {{number}}</h1>
  <p>Price: {{price}}</p>
  <p>Beds: {{beds}}</p>
  <p>Baths: {{baths}}</p>
  <p>Interior: {{interior_sf}}</p>
  <p>Total: {{total_sf}}</p>
  <p>Status: {{status}}</p>
  <p>Video ID: {{video_id}}</p>
  <p>Floorplan: <a href="{{floorplan}}">View</a></p>
  <p>Images: {{images}}</p>
</body>
</html>
